<svg xmlns="http://www.w3.org/2000/svg" id="herologo" viewBox="0 0 300 132" role="img" aria-label="Sparks"><style>@keyframes logoOrbit{to{transform:rotate(360deg)}}@keyframes logoBreathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.78}}@keyframes logoTwink{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.45)}}@keyframes logoGlowPulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
#herologo{width:min(340px,100%);height:auto;display:block;margin:0 0 4px -14px;overflow:visible} /* the whole chip is the click target, logo included */
.pico{width:15px;height:15px;display:block}
#herologo{width:186px;height:auto;display:block;margin:0;overflow:visible;flex:none}
#logoArcs{animation:logoOrbit 52s linear infinite}
#logoDots{animation:logoOrbit 34s linear infinite}
#logoTwinkle{animation:logoOrbit 120s linear infinite reverse}
#logoArcs,#logoDots,#logoTwinkle,#herologo .comet{transform-origin:150px 66px;transform-box:view-box}
/* sparks: bright bodies with tapered tails, sweeping the orbits at speed */
#herologo .comet{animation:logoOrbit 7.5s linear infinite}
#herologo .cmB{animation-duration:11s;animation-direction:reverse;animation-delay:-4s}
#herologo .cmC{animation-duration:5.4s;animation-delay:-2s}
/* planets breathe on their own beats */
#herologo .pl{animation:logoBreathe 9s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
#herologo .pl2{animation-duration:12s;animation-delay:-3s}
#herologo .pl3{animation-duration:7.5s;animation-delay:-5s}
#herologo .pl4{animation-duration:10.5s;animation-delay:-1.5s}
/* the dust twinkles, and the mark glows faintly as the sparks pass */
#herologo .tw{animation:logoTwink 3.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
#herologo .tw2{animation-duration:2.6s;animation-delay:-.7s}
#herologo .tw3{animation-duration:4.2s;animation-delay:-1.9s}
#herologo .tw4{animation-duration:3s;animation-delay:-2.4s}
#herologo .tw5{animation-duration:2.2s;animation-delay:-1.1s}
#herologo .tw6{animation-duration:3.8s;animation-delay:-.4s}
#logoGlow{animation:logoGlowPulse 6.5s ease-in-out infinite;transform-origin:150px 66px;transform-box:view-box}
  #herologo .comet{display:none}
  #herologo{width:150px}body #herologo{width:150px}</style>
      <defs>
        <radialGradient id="lgGlow"><stop offset="0" stop-color="#C2410C" stop-opacity=".18"/><stop offset="1" stop-color="#C2410C" stop-opacity="0"/></radialGradient>
      </defs>
      <circle id="logoGlow" cx="150" cy="66" r="60" fill="url(#lgGlow)"/>
      <g id="logoArcs" fill="none" stroke-linecap="round">
        <path d="M150 14 A 52 52 0 0 1 197 47" stroke="#C2410C" stroke-width="1.1" opacity=".85"/>
        <path d="M124 17 A 52 52 0 0 0 100 34" stroke="#8A8172" stroke-width=".9" opacity=".55" stroke-dasharray="1.6 5"/>
        <path d="M150 118 A 52 52 0 0 1 103 85" stroke="#C2410C" stroke-width="1" opacity=".7"/>
        <path d="M176 115 A 52 52 0 0 0 200 98" stroke="#8A8172" stroke-width=".8" opacity=".5"/>
        <path d="M206 62 A 60 60 0 0 1 198 92" stroke="#C2410C" stroke-width=".7" opacity=".4"/>
      </g>
      <g id="logoTwinkle" fill="#3A362F">
        <circle class="tw" cx="120" cy="18" r="1.3"/>
        <circle class="tw tw2" cx="110" cy="25" r="1"/>
        <circle class="tw tw3" cx="176" cy="115" r="1.2"/>
        <circle class="tw tw4" cx="188" cy="108" r="1"/>
        <circle class="tw tw5" cx="206" cy="76" r="1.1" fill="#C2410C"/>
        <circle class="tw tw6" cx="96" cy="52" r="1" fill="#C2410C"/>
        <circle class="tw tw2" cx="212" cy="40" r=".9"/>
        <circle class="tw tw4" cx="88" cy="92" r=".9"/>
      </g>
      <text x="150" y="76" text-anchor="middle" fill="#C2410C"
        style="font-family:var(--sans);font-size:33px;font-weight:600;letter-spacing:.30em">SPΛRKS</text>
      <g id="logoDots">
        <circle class="pl" cx="150" cy="14" r="4.4" fill="#C2410C" stroke="#FAF7F2" stroke-width="1.7"/>
        <circle class="pl pl2" cx="198" cy="49" r="6.4" fill="#1E1B16" stroke="#FAF7F2" stroke-width="1.7"/>
        <circle class="pl pl3" cx="102" cy="86" r="5.2" fill="#9C948A" stroke="#FAF7F2" stroke-width="1.7"/>
        <circle class="pl pl4" cx="150" cy="118" r="3.6" fill="#C2410C" stroke="#FAF7F2" stroke-width="1.6"/>
      </g>
      <g class="comet cmA">
        <path d="M114 24 A 52 52 0 0 1 136 15.4" stroke="#C2410C" stroke-width="1.9" fill="none" opacity=".16" stroke-linecap="round"/>
        <path d="M132 16.5 A 52 52 0 0 1 144 14.4" stroke="#C2410C" stroke-width="2.2" fill="none" opacity=".38" stroke-linecap="round"/>
        <circle cx="150" cy="14" r="2.9" fill="#C2410C"/>
        <circle cx="150" cy="14" r="5.4" fill="#C2410C" opacity=".2"/>
      </g>
      <g class="comet cmB">
        <path d="M124 38.5 A 38 38 0 0 0 138 30.4" stroke="#8A8172" stroke-width="1.5" fill="none" opacity=".2" stroke-linecap="round"/>
        <circle cx="150" cy="28" r="2" fill="#1E1B16" opacity=".8"/>
      </g>
      <g class="comet cmC">
        <path d="M108 12 A 62 62 0 0 1 132 5" stroke="#C2410C" stroke-width="1.3" fill="none" opacity=".14" stroke-linecap="round"/>
        <circle cx="150" cy="4" r="1.7" fill="#C2410C" opacity=".85"/>
      </g>
    </svg>